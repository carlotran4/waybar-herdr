[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "waybar-herdr"
version = "0.1.1"
description = "Event-driven Herdr agent status module for Waybar"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Carlo Tran" }]
keywords = ["waybar", "herdr", "hyprland", "ai-agents", "status-bar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/carlotran4/waybar-herdr"
Repository = "https://github.com/carlotran4/waybar-herdr"
Issues = "https://github.com/carlotran4/waybar-herdr/issues"

[project.scripts]
waybar-herdr = "waybar_herdr.cli:main"

[dependency-groups]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "twine>=6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["waybar_herdr"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
